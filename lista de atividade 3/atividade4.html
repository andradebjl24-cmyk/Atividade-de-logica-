<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de logica</title>
</head>
<body>

    <h1>Faça um programa que leia 5 números inteiros usando o loop "while" e exiba a média aritmética dos valores lidos.</h1>

    <script>

        let i = 0, soma = 0

        while (i < 5){
        let n = Number(prompt("Número:"))
        soma += n
        i++
        }
        
        console.log(soma / 5)

    </script>
    
</body>
</html>
