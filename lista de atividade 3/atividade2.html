<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de logica</title>
</head>
<body>

    <h1>Escreva um programa que calcule a soma dos números de 1 a 100 usando o loop "while".</h1>

    <script>

        let i = 1, soma = 0

        while (i <= 100){
        soma += i
        i++
        }

        console.log(soma)

    </script>
    
</body>
</html>
