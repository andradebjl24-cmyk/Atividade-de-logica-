<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de logica</title>
</head>
<body>

    <h1>Ler um saldo e aplicar reajuste de 1.5%</h1>

    <script>

        let saldo = Number(prompt("Digite seu saldo:"))
        let novoSaldo = saldo * 1.015

        document.write("<br>Saldo original: R$ " + saldo.toFixed(2))
        document.write("Saldo com reajuste: R$ " + novoSaldo.toFixed(2))

    </script>
    
</body>
</html>
