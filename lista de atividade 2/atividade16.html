<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de logica</title>
</head>
<body>

    <h1>leia a idade de 20 pessoas e exiba a média das idades</h1>

    <script>

        let soma = 0

        for (let n = 1; n <= 20; n++) {
        let idade = parseInt(prompt("Digite a idade:"))
        soma += idade;
        }

        let media = soma / 20

        document.write("Média das idades: " + media)

    </script>
    
</body>
</html>
