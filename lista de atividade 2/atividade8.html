<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de logica</title>
</head>
<body>

    <h1>IPI</h1>

    <script>

        let ipi = Number(prompt("digite a porcentagem do IPI:"))
        let codigo1 = prompt("digite o código da peça 1:")
        let valor1 = Number(prompt("digite o valor da peça 1:"))
        let quantidade1 = parseInt(prompt("digite a quantidade da peça 1:"))

        let codigo2 = prompt("digite o código da peça 2:")
        let valor2 = Number(prompt("digite o valor da peça 2:"))
        let quantidade2 = parseInt(prompt("digite a quantidade da peça 2:"))


        let total = (valor1 * quantidade1 + valor2 * quantidade2) * (ipi / 100 + 1)

        document.write("<br>Código peça 1: " + codigo1)
        document.write("<br>Código peça 2: " + codigo2)
        document.write("<br>Valor total: R$ " + total.toFixed(2))

    </script>
    
</body>
</html>
