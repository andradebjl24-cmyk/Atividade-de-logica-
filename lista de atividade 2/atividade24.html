<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de logica</title>
</head>
<body>

    <h1>leia uma sequência de números do usuário e realize a soma desses números.<br>
        Encerre a execução quando um número negativo for digitado</h1>

        <script>

            let soma = 0
            let numero

            do {
            numero = parseFloat(prompt("Digite um número:"))
    
            if (numero >= 0) {
            soma += numero
            }

            } while (numero >= 0)

           document.write("Soma: " + soma)

        </script>

</body>
</html>
