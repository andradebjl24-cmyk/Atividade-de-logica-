<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de logica</title>
</head>
<body>

    <h1>calcule a soma dos números de 1 a 15</h1>

    <script>

        let soma = 0
 
        //repetição 

        for (let n = 1; n <= 15; n++) {
        soma += n
        }

        document.write("Soma de 1 a 15: " + soma)

    </script>
    
</body>
</html>
