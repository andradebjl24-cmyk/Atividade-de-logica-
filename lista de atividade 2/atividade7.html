<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de logica</title>
</head>
<body>

    <h1>média aritmética dos números 8,9 e 7</h1>

    <script>

        let n1 = parseFloat(prompt("Digite o primeiro número:"))
        let n2 = parseFloat(prompt("Digite o segundo número:"))
        let n3 = parseFloat(prompt("Digite o terceiro número:"))

        let n4 = parseFloat(prompt("Digite o quarto número:"))
        let n5 = parseFloat(prompt("Digite o quinto número:"))
        let n6 = parseFloat(prompt("Digite o sexto número:"))

        let media1 = (n1 + n2 + n3) / 3;
        let media2 = (n4 + n5 + n6) / 3;

        let soma = media1 + media2
        let mediaFinal = soma / 2

        document.write("<br>Média 1: " + media1)
        document.write("<br>Média 2: " + media2)
        document.write("<br>Soma das médias: " + soma)
        document.write("Média das médias: " + mediaFinal)

    </script>
    
</body>
</html>
