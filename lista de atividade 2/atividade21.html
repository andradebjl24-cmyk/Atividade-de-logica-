<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de logica</title>
</head>
<body>

    <h1>que receba um valor de uma compra e mostre o valor das prestações</h1>

    <script>

        let valor = parseFloat(prompt("Valor da compra:"))

        let prestacao = valor / 5

        document.write("Valor de cada prestação: R$ " + prestacao.toFixed(2))

    </script>
    
</body>
</html>
