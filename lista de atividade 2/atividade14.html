<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de logica</title>
</head>
<body>

    <h1>leia 10 números do usuário e calcule a soma desses números</h1>

    <script>

        let soma = 0

        for (let n = 1; n <= 10; n++) {
        let numero = parseFloat(prompt("Digite o número " + n + ":"))
        soma += numero
        }

        document.write("Soma total: " + soma)

    </script>
    
</body>
</html>
