<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de logica</title>
</head>
<body>
    <h1>verificar se é divisível por 10, 5 ou 2 ou nenhum deles</h1>

    <script>

        let numero = parseInt(prompt("Digite um número"))

        //se um número 

        if(numero % 10 === 0){
        document.write("Divisível por 10")
        }
        else if(numero % 5 === 0){
        document.write("Divisível por 5")
        }
        else if(numero % 2 === 0){
        document.write("Divisível por 2")
        }
        else{
        document.write("Não é divisívelpor nenhum deles")
        }

    </script>
</body>
</html>
