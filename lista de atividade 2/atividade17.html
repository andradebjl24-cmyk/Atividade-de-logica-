<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de logica</title>
</head>
<body>

    <h1>que leia a idade de 20 pessoas e exiba quantas pessoas são maiores de idade</h1>

    <script>

        let exiba = 0

        for (let n = 1; n <= 20; n++) {
        let idade = parseInt(prompt("Digite a idade:"))

        if (idade >= 18) {
        exiba++
        }
        }

        document.write("Maiores de idade: " + exiba)

    </script>
    
</body>
</html>
