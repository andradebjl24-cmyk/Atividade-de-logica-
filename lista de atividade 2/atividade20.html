<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de logica</title>
</head>
<body>

    <h1>leia 20 números do usuário e exiba quantos números são maiores do que 8</h1>

    <script>

        let valor = 0

        for (let v = 1; v <= 20; v++) {
        let numero = parseFloat(prompt("Digite um número:"))

        if (numero > 8) {
        valor++
        }
        }

        document.write("Maiores que 8: " + valor)

    </script>
    
</body>
</html>
