<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de logica</title>
</head>
<body>

    <h1>leia 20 números e, ao final, escreva quantos estão entre 0 e 100, <br>
        quantos estão entre 101 e 200 e quantos são maiores de 200</h1>

    <script>

        let n1 = 0
        let n2 = 0
        let n3 = 0

        for (let v = 1; v <= 20; v++) {
        let numero = parseFloat(prompt("Digite um número:"))

        if (numero >= 0 && numero <= 100) {
        n1++
        } else if (numero <= 200) {
        n2++
        } else {
        n3++
        }
        }

        document.write("<br>0-100: " + n1)
        document.write("<br>101-200: " + n2)
        document.write("<br>Maior que 200: " + n3)

    </script>
    
</body>
</html>
