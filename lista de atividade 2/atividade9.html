<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de logica</title>
</head>
<body>

    <h1>leia o valor do salário mínimo e o valor do salário de um usuário</h1>

    <script>

        let salarioMinimo = 1212

        let salarioUser = parseFloat(prompt("Digite seu salário:"))

        let quantidade = salarioUser / salarioMinimo

        document.write("Você ganha " + quantidade.toFixed(2) + " salários mínimos")


    </script>
    
</body>
</html>
