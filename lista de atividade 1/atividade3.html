<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de logica</title>
</head>
<body>

    <h1>Atividade em JavaScript</h1>

    <script>

        let saldo = Number(prompt("Digite o saldo:"))

        let reajuste = saldo * 0.01
        let novoSaldo = saldo + reajuste

        document.write("Saldo com reajuste: " + novoSaldo)

    </script>
    
</body>
</html>
