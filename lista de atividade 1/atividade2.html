<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de logica</title>
</head>
<body>

    <h1>Atividade em JavaScript</h1>
    
    <script>

        //primeiro soma as medias e divide por 3
        let media1 = (8 + 9 + 7) / 3
        let media2 = (4 + 5 + 6) / 3
        
        //aqui soma as duas medias e divide por 2
        let somaMedias = media1 + media2
        let mediaFinal = somaMedias / 2

        document.write("<br>Média 1:" + media1)
        document.write("<br>Média 2:" + media2)
        document.write("<br>Soma das médias: " + somaMedias)
        document.write("<br>Média das médias: " + mediaFinal)

    </script>

</body>
</html>
