<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de Logica</title>
</head>
<body>

    <h1>Atividade de JavaScript</h1>

    <script>

        let numero = Number(prompt("Digite um número:"))

        let antecessor = numero - 1
        let sucessor = numero + 1

        document.write("Antecessor: " + antecessor)
        document.write("<br>Sucessor: " + sucessor)

    </script>
    
</body>
</html>
