<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de logica</title>
</head>
<body>

    <h1> Atividade em JavaScript</h1>

    <script>

        let salarioMinimo = 788
        let salarioPessoa = Number(prompt("Digite o salário da pessoa:"))

        let quantidade = salarioPessoa / salarioMinimo;

        document.write("Quantidade de salários mínimos: " + quantidade)

    </script>
    
</body>
</html>
