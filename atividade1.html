<!DOCTYPE html>
<html lang="pt-Br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de logica</title>
</head>
<body>

    <h1>Atividade de JavaScript</h1>

    <script>

        const ano = 365; 
        const mes = 30;

        //let é variavel 
        let anos = Number(prompt("Digite os anos:"))
        let meses = Number(prompt("Digite os meses:"))
        let dias = Number(prompt("Digite os dias:"))
        //number para forçar sempre número

        //tranforma meses e anos em dias e soma os dias
        let totalDias = (anos * ano) + (meses * mes) + dias;

        document.write("Total em dias:" + totalDias);

    </script>
    
</body>
</html>
