<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de logica</title>
</head>
<body>

    <h1>16 Faça um programa que leia uma matriz 3x3 de números inteiros e exiba a matriz na tela.</h1>

    <script>

        let matriz = [];

        for (let i = 0; i < 3; i++) {
        matriz[i] = [];
        for (let j = 0; j < 3; j++) {
        matriz[i][j] = parseInt(prompt("Digite um número:"));
        }

        }

       // mostrar
       for (let i = 0; i < 3; i++) {
       document.write(matriz[i] + "<br>");
       }
       
    </script>
    
</body>
</html>
