<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de logica</title>
</head>
<body>

    <h1>04 Faça um programa que leia 5 números inteiros e exiba quantos deles são pares.</h1>

    <script>

        let nuPares = 0;

        for (let i = 0; i < 5; i++){
        let valor = parseInt(prompt("Digite o número:"));

        if (valor % 2 === 0) {
            nuPares++;
        }
        }

        document.write("Quantidade de números pares: " + nuPares);
    
    </script>
    
</body>
</html>
