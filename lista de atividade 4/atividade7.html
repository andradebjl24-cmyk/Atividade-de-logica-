<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de logica</title>
</head>
<body>

    <h1>07 Faça um programa que leia 10 números inteiros e exiba quantos deles são positivos.</h1>

    <script>

        let numeros = []

        for (let i = 0; i < 10; i++){
        numeros.push(parseInt(prompt("Digite um número:")));
        }

        let positivos = 0;

        for (let num of numeros){
        if (num > 0) positivos++;
        }

        document.write("Positivos: " + positivos);

    </script>
    
</body>
</html>
