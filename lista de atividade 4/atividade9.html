<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de logica</title>
</head>
<body>

    <h1>09 Crie um programa que leia 10 números inteiros e exiba a quantidade de números positivos e a quantidade de números negativos.</h1>

    <script>

        let numeros = [];

        for (let i = 0; i < 10; i++){
        numeros.push(parseInt(prompt("Digite um número:")));
        }

        let pos = 0, neg = 0;

        for (let num of numeros){
        if (num > 0) pos++;
        else if (num < 0) neg++;
        }

        document.write("Positivos: " + pos + "<br>Negativos: " + neg);

    </script>
    
</body>
</html>
