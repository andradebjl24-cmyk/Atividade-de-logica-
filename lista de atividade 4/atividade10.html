<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de logica</title>
</head>
<body>

    <h1>10 Faça um programa que leia 5 números inteiros e verifique se algum deles é igual a zero.</h1>

    <script>

        let numeros = []
        let temZero = false

        for (let i = 0; i < 5; i++){
        numeros.push(parseInt(prompt("Digite um número:")));
        }

        for (let num of numeros){
        if (num === 0){
        temZero = true;
        }
        }

        document.write(temZero ? "Tem zero" : "Não tem zero");

    </script>
    
</body>
</html>
