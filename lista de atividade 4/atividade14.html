<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de logica</title>
</head>
<body>

    <h1>14 Escreva um programa que leia 7 números inteiros e exiba apenas os números pares.</h1>

    <script>

        let numeros = []

        for (let i = 0; i < 7; i++){
        numeros.push(parseInt(prompt("Digite um número:")));
        }

       for (let num of numeros){
        if (num % 2 === 0){
        document.write(num + "<br>");
        }

        }

    </script>
    
</body>
</html>
