<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de logica</title>
</head>
<body>

    <h1>06 Crie um programa que leia 10 números inteiros e exiba-os em ordem crescente.</h1>

    <script>

       let numeros = []

       for (let i = 0; i < 10; i++){
       numeros.push(parseInt(prompt("Digite o número:")));
       }

       numeros.sort((a, b) => a - b);

       document.write("Ordem crescente: " + numeros);

    </script>
    
</body>
</html>
