<!DOCTYPE html>

<body>

    <h1>15 Crie um programa que leia 5 nomes e exiba-os em ordem alfabética.</h1>

    <script>

        let nomes = [];

        for (let i = 0; i < 5; i++) {
    nomes.push(prompt("Digite um nome:"));
}

nomes.sort();

document.write("Ordem alfabética: " + nomes);
    </script>
    
</body>
</html>
