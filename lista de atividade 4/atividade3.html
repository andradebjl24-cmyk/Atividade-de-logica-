<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de logica</title>
</head>
<body>

    <h1>03  Crie um programa que leia 7 números inteiros e exiba a média aritmética dos valores lidos. </h1>

    <script>

        let soma = 0

    for (let i = 0; i < 7; i++){
        let valor = parseInt(prompt("Digite um número:"));
        soma += valor;
    }

    let media = soma / 7;

    document.write("Média: " + media);
    
    </script>
    
</body>
</html>
