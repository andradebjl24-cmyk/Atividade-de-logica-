<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de logica</title>
</head>
<body>

    <h1>05 Escreva um programa que leia 5 números inteiros e exiba o maior e o menor valor digitado.</h1>

    <script>

        let maior = 0

        let menor = 0


         for (let i = 0; i < 5; i++){
            numero = parseInt(prompt("Digite um número:"));

            if (i === 0) {
            maior = numero;
            menor = numero;
            } else {
            if (numero > maior){
                maior = numero;
            }

            if (numero < menor){
                menor = numero;
            }
            }
        }

        document.write("Maior número: " + maior + "<br>" + "Menor número: " + menor );
    
        
    </script>
    
</body>
</html>
