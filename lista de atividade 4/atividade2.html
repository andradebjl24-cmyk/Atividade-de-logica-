<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de logica</title>
</head>
<body>

    <h1>02 Escreva um programa que leia 10 números inteiros e exiba a soma deles.</h1>

    <script>

        let soma = 0

        for (let i = 0; i < 10; i++) {
        let numero = parseInt(prompt(`Digite o ${i + 1}º número:`));
        soma += numero;
        }

        document.write("A soma dos 10 números é: " + soma);

    </script>
    
</body>
</html>
