<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de logica</title>
</head>
<body>

    <h1>12 Crie um programa que leia 5 números inteiros e exiba-os em ordem decrescente.</h1>

    <script>

        let numeros = []

        for (let i = 0; i < 5; i++){
        numeros.push(parseInt(prompt("Digite um número:")));
        }

       numeros.sort((a, b) => b - a);

      document.write("Decrescente: " + numeros);

    </script>
    
</body>
</html>
