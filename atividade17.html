<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de logica</title>
</head>
<body>

    <h1>17 Escreva um programa que leia uma matriz 2x2 de números inteiros e calcule a soma de todos os elementos.</h1>

    <script>
        let matriz = [];
        let soma = 0;
        for (let i = 0; i < 2; i++) {
            matriz[i] = [];
            for (let j = 0; j < 2; j++) {
                matriz[i][j] = parseInt(prompt(`Digite um número inteiro para a posição [${i}][${j}]:`));
                soma += matriz[i][j];
            }
        }
        console.log("Matriz 2x2:");
        for (let i = 0; i < 2; i++) {
            console.log(matriz[i].join(" "));
        }
        console.log("Soma de todos os elementos:", soma);
    </script>
    
</body>
</html>
