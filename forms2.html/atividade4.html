<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>repita comigo</title>
</head>
<body>

    <h1>atividade 4</h1>

    <script>

        let soma = 0
        let quantidade = 0

        for (let i = 15; i <= 100; i++) {
            soma = soma + i;
            quantidade = quantidade + 1;
        }

        let media = soma / quantidade

        document.write("Média: " + media)
        
    </script>
    
</body>
</html>
