<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>repita comigo</title>
</head>
<body>

    <h1>atividade 10</h1>

    <script>

        let n = parseInt(prompt("Digite até qual tabuada:"))

        for(let i = 1; i <= n; i++){
           document.write("Tabuada do " + i + "<br>")

         for(let j = 1; j <= 10; j++){
              document.write(i + " x " + j + " = " + (i * j) + "<br>")
        }
        }

    </script>
    
</body>
</html>
